services:
  chute:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CHUTE_TURN_URL: ${CHUTE_TURN_URL:-turn:127.0.0.1:3478}
      CHUTE_TURN_USERNAME: ${CHUTE_TURN_USERNAME:-chute}
      CHUTE_TURN_CREDENTIAL: ${CHUTE_TURN_CREDENTIAL:-CHANGE_ME_STRONG_PASSWORD}
      CHUTE_STUN_URLS: ${CHUTE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      CHUTE_FALLBACK_DAILY_BYTES: ${CHUTE_FALLBACK_DAILY_BYTES:-1073741824}
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
    # host networking is required so external-ip and UDP relay ports work correctly.
    # For local-only testing without host mode, see docker-compose.dev.yml.
