services:
  chute:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Browsers need a host-reachable TURN URL. Replace with your LAN/public IP.
      CHUTE_TURN_URL: ${CHUTE_TURN_URL:-turn:127.0.0.1:3478}
      CHUTE_TURN_USERNAME: ${CHUTE_TURN_USERNAME:-chute}
      CHUTE_TURN_CREDENTIAL: ${CHUTE_TURN_CREDENTIAL:-chute}
      CHUTE_STUN_URLS: ${CHUTE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
