# coturn for Chute — production-oriented defaults
#
# Required for public deploy:
#   1. Set EXTERNAL_IP (or edit external-ip below)
#   2. Change user credentials (must match CHUTE_TURN_* on the chute service)
#   3. Open UDP/TCP 3478 and UDP 49152-49200 on the firewall

listening-port=3478
min-port=49152
max-port=49200
fingerprint
lt-cred-mech
user=chute:CHANGE_ME_STRONG_PASSWORD
realm=chute.local
no-cli
no-tls
no-dtls
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-stdout-log
log-file=stdout

# Uncomment and set to your public IPv4 (and optional private relay IP):
# external-ip=203.0.113.10
# Or: external-ip=203.0.113.10/10.0.0.5

# Keep relay on sane hosts (Hetzner/OVH). Avoid AWS/GCP egress pricing.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
