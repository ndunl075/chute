# Dev-friendly compose without host networking (LAN/localhost only).
services:
  chute:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CHUTE_TURN_URL: turn:127.0.0.1:3478
      CHUTE_TURN_USERNAME: chute
      CHUTE_TURN_CREDENTIAL: chute
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn.dev.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
